<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>排班日历 · 云值守</title>
  <style>
    :root {
      --bg: #f3f5f8;
      --panel: #ffffff;
      --ink: #1e293b;
      --muted: #64748b;
      --line: #e2e8f0;
      --early: #6b9de8;
      --early-ink: #153a6b;
      --mid: #4db8a8;
      --mid-ink: #0f4d44;
      --late: #eba04a;
      --late-ink: #6b3a08;
      --night: #9b82e0;
      --night-ink: #34225e;
      --rest: #d8dce3;
      --rest-ink: #3f4754;
      --empty: #eef0f3;
      --empty-ink: #7b8494;
      --gap: #d95353;
      --ok: #3d9a72;
      --leave: #d95353;
      --accent: #4a86d4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Helvetica Neue", sans-serif;
      color: var(--ink);
      background: var(--bg);
      font-size: 13px;
    }
    .top {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 12px 16px 10px;
    }
    .top-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 18px; font-weight: 700; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 4px; max-width: 640px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .actions select, .actions button {
      font: inherit; height: 32px; border-radius: 6px; border: 1px solid var(--line);
      padding: 0 10px; background: #fff; cursor: pointer;
    }
    .actions button.primary {
      background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600;
    }
    .actions button.primary:disabled { opacity: 0.6; cursor: wait; }
    .actions button.ghost:hover { background: #f9fafb; }
    .legend {
      display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; align-items: center;
      color: var(--muted); font-size: 12px;
    }
    .legend .adj-btn {
      font: inherit; height: 26px; border-radius: 6px; border: 1px solid var(--line);
      padding: 0 10px; background: #fff; cursor: pointer; color: var(--ink); font-weight: 600;
    }
    .legend .adj-btn:hover { background: #f9fafb; }
    .modal-mask {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 50; padding: 16px;
    }
    .modal-mask[hidden] { display: none; }
    .modal {
      background: #fff; border-radius: 10px; width: min(640px, 100%);
      max-height: min(80vh, 640px); overflow: auto;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.2);
      padding: 16px 18px 14px;
    }
    .modal h3 { margin: 0 0 6px; font-size: 16px; }
    .modal .modal-tip { margin: 0 0 12px; color: var(--muted); font-size: 12px; }
    .shift-edit-row {
      display: grid;
      grid-template-columns: 88px 64px 1fr auto 1fr 28px;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .shift-edit-row input[type="text"],
    .shift-edit-row input[type="time"],
    .shift-edit-row select {
      font: inherit; height: 30px; border: 1px solid var(--line);
      border-radius: 6px; padding: 0 8px; width: 100%; background: #fff;
    }
    .shift-edit-row .sep { color: var(--muted); }
    .shift-edit-row .del-shift {
      height: 28px; width: 28px; border: 0; background: transparent;
      color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1;
    }
    .shift-edit-row .del-shift:hover { color: var(--gap); }
    .shift-add {
      font: inherit; height: 30px; border-radius: 6px; border: 1px dashed var(--line);
      padding: 0 12px; background: #fff; cursor: pointer; color: var(--ink);
      margin: 4px 0 0;
    }
    .shift-add:hover { background: #f9fafb; }
    .modal-actions {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end;
      margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line);
    }
    .modal-actions button {
      font: inherit; height: 32px; border-radius: 6px; border: 1px solid var(--line);
      padding: 0 12px; background: #fff; cursor: pointer;
    }
    .modal-actions button.primary {
      background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600;
    }
    .staff-toolbar {
      display: flex; gap: 8px; align-items: center; margin-bottom: 10px;
    }
    .staff-toolbar input {
      font: inherit; height: 30px; border: 1px solid var(--line);
      border-radius: 6px; padding: 0 8px; flex: 1; min-width: 0;
    }
    .staff-toolbar .cnt { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .staff-edit-list { max-height: 52vh; overflow: auto; }
    .staff-edit-row {
      display: grid;
      grid-template-columns: 1fr 96px;
      gap: 8px;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid var(--line);
    }
    .staff-edit-row .n { font-weight: 600; color: var(--ink); }
    .staff-edit-row .m { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .staff-edit-row select {
      font: inherit; height: 30px; border: 1px solid var(--line);
      border-radius: 6px; padding: 0 6px; background: #fff;
    }
    .leg {
      display: inline-flex; align-items: center; gap: 6px;
    }
    .chip {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 22px; height: 22px; border-radius: 4px; font-size: 11px; font-weight: 700;
    }
    .chip.band-early { background: var(--early); color: var(--early-ink); }
    .chip.band-mid { background: var(--mid); color: var(--mid-ink); }
    .chip.band-late { background: var(--late); color: var(--late-ink); }
    .chip.band-night { background: var(--night); color: var(--night-ink); }
    .chip.rest { background: var(--rest); color: var(--rest-ink); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #c4c9d2; display: inline-block; }
    .leave-mark { color: var(--leave); font-weight: 700; }

    .layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 12px;
      padding: 12px 16px 24px;
      align-items: start;
    }
    @media (max-width: 1100px) {
      .layout { grid-template-columns: 1fr; }
    }

    .cal-wrap {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: auto;
      max-height: calc(100vh - 140px);
    }
    table.cal {
      border-collapse: separate;
      border-spacing: 0;
      min-width: 100%;
    }
    .cal th, .cal td {
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      text-align: center;
      padding: 0;
      vertical-align: middle;
    }
    .cal thead th {
      position: sticky; top: 0; z-index: 3;
      background: #fafafa;
      font-weight: 500;
      color: var(--muted);
      font-size: 11px;
      height: 28px;
    }
    .cal thead tr.demand th {
      top: 28px;
      height: 32px;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 12px;
      color: var(--ink);
    }
    .cal thead tr.demand th.short { color: var(--gap); }
    .cal thead tr.demand th.ok { color: var(--ok); }
    .cal .sticky-name {
      position: sticky; left: 0; z-index: 2;
      background: #fff;
      text-align: left;
      padding: 8px 10px;
      min-width: 128px;
      border-right: 1px solid var(--line);
    }
    .cal thead .sticky-name { z-index: 4; background: #fafafa; }
    .name { font-weight: 600; color: var(--ink); }
    .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .cell {
      width: 76px; height: 44px;
      cursor: pointer; user-select: none;
      background: #fff;
      position: relative;
      padding: 4px;
    }
    .cell:hover { outline: 2px solid #b7c9dc; outline-offset: -2px; }
    .cell.selected { background: #eef2f7; }
    .cell-shift {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 6px;
      font: inherit;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      padding: 0 14px 0 4px;
      position: relative;
    }
    .cell-shift::after {
      content: "";
      position: absolute;
      right: 6px;
      top: 50%;
      width: 0; height: 0;
      border-left: 3.5px solid transparent;
      border-right: 3.5px solid transparent;
      border-top: 4.5px solid currentColor;
      opacity: 0.55;
      transform: translateY(-35%);
    }
    .cell-shift.empty {
      color: var(--empty-ink);
      background: var(--empty);
    }
    .cell-shift.band-early { background: var(--early); color: var(--early-ink); }
    .cell-shift.band-mid { background: var(--mid); color: var(--mid-ink); }
    .cell-shift.band-late { background: var(--late); color: var(--late-ink); }
    .cell-shift.band-night { background: var(--night); color: var(--night-ink); }
    .cell-shift.rest { background: var(--rest); color: var(--rest-ink); }

    .shift-picker {
      position: fixed;
      z-index: 80;
      min-width: 92px;
      max-height: 320px;
      overflow: auto;
      padding: 6px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 10px 28px rgba(44, 51, 64, 0.14);
    }
    .shift-picker[hidden] { display: none; }
    .shift-picker button {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 6px;
      font: inherit;
      font-weight: 700;
      font-size: 13px;
      padding: 8px 10px;
      margin-bottom: 4px;
      cursor: pointer;
      text-align: center;
    }
    .shift-picker button:last-child { margin-bottom: 0; }
    .shift-picker button.on { outline: 2px solid var(--accent); outline-offset: -2px; }
    .shift-picker button.empty { background: var(--empty); color: var(--empty-ink); }
    .shift-picker button.rest { background: var(--rest); color: var(--rest-ink); }
    .shift-picker button.band-early { background: var(--early); color: var(--early-ink); }
    .shift-picker button.band-mid { background: var(--mid); color: var(--mid-ink); }
    .shift-picker button.band-late { background: var(--late); color: var(--late-ink); }
    .shift-picker button.band-night { background: var(--night); color: var(--night-ink); }

    .side {
      display: flex; flex-direction: column; gap: 12px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .card h2 {
      margin: 0 0 10px; font-size: 14px; font-weight: 700;
    }
    .tabs {
      display: flex; gap: 6px; margin-bottom: 10px;
    }
    .tabs button {
      flex: 1; height: 30px; border: 1px solid var(--line); border-radius: 6px;
      background: #fff; cursor: pointer; font: inherit;
    }
    .tabs button.on { background: #111827; color: #fff; border-color: #111827; }
    .hour-chart {
      max-height: calc(100vh - 280px);
      overflow: auto;
      padding-right: 2px;
    }
    .hour-chart-legend {
      display: flex; flex-wrap: wrap; gap: 10px;
      font-size: 11px; color: var(--muted); margin-bottom: 8px;
    }
    .hour-chart-legend i {
      display: inline-block; width: 10px; height: 10px; border-radius: 2px;
      margin-right: 4px; vertical-align: -1px;
    }
    .hour-chart-legend .req { background: #cbd5e1; }
    .hour-chart-legend .sup { background: var(--ok); }
    .hour-chart-legend .gap { background: var(--gap); }
    .hbar {
      display: grid;
      grid-template-columns: 36px 1fr 52px;
      gap: 6px;
      align-items: center;
      margin-bottom: 5px;
      font-variant-numeric: tabular-nums;
      font-size: 11px;
    }
    .hbar .h { color: var(--muted); text-align: right; }
    .hbar .track {
      position: relative;
      height: 14px;
      background: #f1f5f9;
      border-radius: 3px;
      overflow: hidden;
    }
    .hbar .bar-req {
      position: absolute; left: 0; top: 0; bottom: 0;
      background: #cbd5e1;
      border-radius: 3px;
    }
    .hbar .bar-sup {
      position: absolute; left: 0; top: 0; bottom: 0;
      background: var(--ok);
      border-radius: 3px;
      opacity: 0.92;
    }
    .hbar .bar-gap {
      position: absolute; top: 0; bottom: 0;
      background: var(--gap);
      opacity: 0.85;
      border-radius: 0 3px 3px 0;
    }
    .hbar .nums { text-align: right; color: var(--ink); white-space: nowrap; }
    .hbar .nums.short { color: var(--gap); font-weight: 600; }
    .hbar .nums.ok { color: var(--ok); }
    .hbar.peak .h { color: var(--ink); font-weight: 700; }
    .roster-list { max-height: calc(100vh - 280px); overflow: auto; }
    .roster-row {
      display: flex; justify-content: space-between; gap: 8px;
      padding: 6px 0; border-bottom: 1px solid var(--line);
    }
    .roster-row .n { font-weight: 600; }
    .roster-row .e { font-variant-numeric: tabular-nums; color: var(--muted); }
    .note { font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.45; }
    .day-pick {
      display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px;
    }
    .day-pick button {
      border: 1px solid var(--line); background: #fff; border-radius: 4px;
      padding: 3px 7px; cursor: pointer; font: inherit; font-size: 11px;
    }
    .day-pick button.on { background: #111827; color: #fff; border-color: #111827; }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-row">
      <div>
        <h1>排班日历</h1>
        <p class="hint">点击格子下拉选择班次；Shift/⌘ 多选后可填充；右键清除。「一键排班」按缺口最小：不跨早/晚/夜，每人每周至少休息 1 天。</p>
      </div>
      <div class="actions">
        <select id="fillShift"></select>
        <button class="primary" id="fillSelected">填充选中</button>
        <button class="primary" id="autoFill" title="按缺口最小贪心，重排本周全部格子">一键排班</button>
        <button class="ghost" id="clearSelected">清除选中</button>
        <button class="ghost" id="clearWeek">清空本周</button>
        <button class="ghost" id="exportJson">导出 JSON</button>
      </div>
    </div>
    <div class="legend" id="legend"></div>
  </header>

  <div class="modal-mask" id="shiftModal" hidden>
    <div class="modal" role="dialog" aria-labelledby="shiftModalTitle">
      <h3 id="shiftModalTitle">班次时间段</h3>
      <p class="modal-tip">可改时间、增删班次；保存后图例和覆盖小时会同步更新（支持跨夜）。</p>
      <div id="shiftEditList"></div>
      <button type="button" class="shift-add" id="shiftAdd">+ 添加班次</button>
      <div class="modal-actions">
        <button type="button" class="ghost" id="shiftReset">恢复默认</button>
        <button type="button" class="ghost" id="shiftCancel">取消</button>
        <button type="button" class="primary" id="shiftSave">保存</button>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="staffModal" hidden>
    <div class="modal" role="dialog" aria-labelledby="staffModalTitle">
      <h3 id="staffModalTitle">人员班段</h3>
      <p class="modal-tip">指定每位客服属于早班、晚班或夜班；一键排班只会在对应班段内排细时间段。</p>
      <div class="staff-toolbar">
        <input type="search" id="staffFilter" placeholder="搜索姓名 / 站点 / 组别" />
        <span class="cnt" id="staffBandCount"></span>
      </div>
      <div class="staff-edit-list" id="staffEditList"></div>
      <div class="modal-actions">
        <button type="button" class="ghost" id="staffReset">恢复默认</button>
        <button type="button" class="ghost" id="staffCancel">取消</button>
        <button type="button" class="primary" id="staffSave">保存</button>
      </div>
    </div>
  </div>

  <div class="shift-picker" id="shiftPicker" hidden></div>

  <div class="layout">
    <aside class="side">
      <section class="card">
        <div class="day-pick" id="dayPick"></div>
        <div class="tabs">
          <button type="button" class="on" data-tab="hour">小时格子</button>
          <button type="button" data-tab="roster">排班名单</button>
          <button type="button" data-tab="eff">历史人效</button>
        </div>
        <div id="tabHour"></div>
        <div id="tabRoster" hidden></div>
        <div id="tabEff" hidden></div>
      </section>
    </aside>

    <div class="cal-wrap">
      <table class="cal" id="cal"></table>
    </div>
  </div>

  <script src="data/schedule_data.js"></script>
  <script src="app.js"></script>
</body>
</html>
